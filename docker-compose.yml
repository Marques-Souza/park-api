services:
  postgres:
    image: postgres:17-alpine
    container_name: park-postgres
    environment:
      POSTGRES_DB: park
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d park"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: park-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/park
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: 0123456789-0123456789-0123456789
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
