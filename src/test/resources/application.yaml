## JPA/H2 Configuration
spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

## API Endpoint configuration
app:
  base-url: http://localhost:8080
  api:
    endpoints:
      users: /api/v1/users
      clients: /api/v1/clients
      parking-spots: /api/v1/parking-spots
      client-parking-spots: /api/v1/client-parking-spots
      parkings: /api/v1/parkings