name: Park API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Integration Tests & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission to Maven wrapper
        run: chmod +x mvnw

      - name: Run integration tests and package JAR
        env:
          DB_URL: jdbc:h2:mem:parktest;DB_CLOSE_DELAY=-1
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
        run: ./mvnw clean package -Dtest=*IT

      - name: Publish Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Integration Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: park-api-jar
          path: target/*.jar
          retention-days: 7

  docker-build:
    name: Validate Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t park-api:ci-test .