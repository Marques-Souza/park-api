name: Park API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission to Maven wrapper
        run: chmod +x mvnw

      - name: Run integration tests and build
        env:
          DB_URL: jdbc:h2:mem:parktest;DB_CLOSE_DELAY=-1
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
        run: ./mvnw clean verify